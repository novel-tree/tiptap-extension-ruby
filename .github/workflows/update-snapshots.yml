name: Update visual snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: true
        default: main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Serve Storybook
        run: pnpm exec http-server storybook-static -p 6006 -s &
      - name: Wait for Storybook
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:6006/index.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Regenerate snapshots
        env:
          STORYBOOK_URL: http://localhost:6006
        run: pnpm test:visual:update
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain visual-tests/__screenshots__)" ]]; then
            git add visual-tests/__screenshots__
            git commit -m "chore: update visual snapshots"
            git push origin HEAD:${{ inputs.branch }}
          else
            echo "No snapshot changes to commit"
          fi
